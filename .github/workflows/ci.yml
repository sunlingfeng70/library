name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: E2E tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: library
          DB_PASSWORD: library
        run: pnpm --filter @library/backend test:e2e

      - name: Build
        run: pnpm -r build